<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World timeline</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="/assets/fonts/inria-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inria-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.min.js"}}</script>
<script type="module" src="globe.js"></script>
</head>
<body>
<div id="app">
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="planet" aria-hidden="true"></canvas>
  <canvas id="globe" role="img" aria-label="Globe with the places visited over time"></canvas>
  <div id="callouts" aria-hidden="true">
    <svg class="leaders"><line></line><circle r="2.5"></circle></svg>
    <div class="callout"></div>
  </div>

  <header id="info">
    <p class="num" id="info-res"></p>
    <h1 class="hero" id="info-month"></h1>
    <p class="day" id="info-day"></p>
    <p class="place" id="info-place"></p>
    <p class="context" id="info-context"></p>
    <dl id="stats" aria-label="Totals so far">
      <div><dt>Countries</dt><dd id="st-countries">0</dd></div>
      <div><dt>Places</dt><dd id="st-places">0</dd></div>
      <div><dt>Trips</dt><dd id="st-trips">0</dd></div>
      <div title="Straight-line distance between consecutive places"><dt>Km traveled</dt><dd id="st-km">0</dd></div>
    </dl>
  </header>

  <aside id="trips" aria-label="List of trips">
    <div class="trips-head">
      <h2>Trips</h2>
      <label class="toggle"><input type="checkbox" id="show-minor"> Short getaways</label>
    </div>
    <ol id="trip-list"></ol>
  </aside>

  <button id="follow" class="chip" hidden>Follow the journey</button>

  <footer id="bar">
    <div class="legend" id="legend"></div>
    <div class="controls">
      <button id="play" class="play" aria-label="Play">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <div class="speeds" role="group" aria-label="Speed">
        <button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
      </div>
      <svg id="scrub" role="slider" aria-label="Timeline" tabindex="0"></svg>
      <button id="toggle-trips" class="ghost" aria-pressed="true">Trips</button>
    </div>
  </footer>

  <div id="tooltip" role="tooltip" hidden></div>
</div>

<div id="lock" hidden>
  <form>
    <h1>World timeline</h1>
    <p>This page is private.</p>
    <input type="text" name="username" value="timeline" autocomplete="username" hidden>
    <label for="lock-pw">Password</label>
    <input type="password" id="lock-pw" autocomplete="current-password" required>
    <label class="remember"><input type="checkbox" id="lock-remember"> Remember on this device</label>
    <button type="submit">Open</button>
    <p class="status" role="status" aria-live="polite"></p>
  </form>
</div>
<noscript><p class="nojs">This page needs JavaScript.</p></noscript>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="data/world.js"></script>
<script src="unlock.js"></script>
</body>
</html>
