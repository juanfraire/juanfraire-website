<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 424" font-family="Inria Sans, Helvetica Neue, Arial, sans-serif"><defs><marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#27348B"/></marker><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A60F79"/></marker><marker id="o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46200"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker><linearGradient id="temp" x1="0" x2="1"><stop offset="0" stop-color="#C9191E"/><stop offset="1" stop-color="#27348B"/></linearGradient></defs><text x="0" y="20" font-size="17" fill="#A60F79" text-anchor="start" font-weight="bold" font-style="normal">reinforcement learning</text><text x="0" y="40" font-size="14" fill="#1d1d22" text-anchor="start" font-weight="normal" font-style="normal">learns what to do in each situation, by trial and error, over many simulated days</text><rect x="4" y="58" width="168" height="62" rx="10" fill="#eef0f8" stroke="#27348B" stroke-width="2"/><text x="88" y="84" font-size="16" fill="#27348B" text-anchor="middle" font-weight="bold" font-style="normal">agent</text><text x="88" y="104" font-size="14" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">the scheduler</text><rect x="402" y="58" width="194" height="62" rx="10" fill="#f5f6f8" stroke="#44546A" stroke-width="2"/><text x="499" y="84" font-size="16" fill="#44546A" text-anchor="middle" font-weight="bold" font-style="normal">environment</text><text x="499" y="104" font-size="14" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">battery · memory · passes</text><path d="M176,72 H398" stroke="#A60F79" stroke-width="2.6" marker-end="url(#m)"/><text x="287" y="64" font-size="14" fill="#A60F79" text-anchor="middle" font-weight="bold" font-style="normal">acquire · downlink · wait</text><path d="M398,106 H176" stroke="#27348B" stroke-width="2.6" marker-end="url(#b)"/><text x="287" y="126" font-size="14" fill="#27348B" text-anchor="middle" font-weight="normal" font-style="normal">new state + reward</text><line x1="0" y1="148" x2="600" y2="148" stroke="#e3e5ea" stroke-width="1.5"/><text x="0" y="174" font-size="17" fill="#c46200" text-anchor="start" font-weight="bold" font-style="normal">simulated annealing</text><text x="0" y="194" font-size="14" fill="#1d1d22" text-anchor="start" font-weight="normal" font-style="normal">searches the plan itself: changes one decision, keeps it if the plan improves</text><g transform="translate(0,-14)"><path d="M30,300 C80,312 120,350 170,348 S240,285 280,288 S350,385 405,382 S505,318 585,302 L585,392 L30,392 Z" fill="#fbf3e9"/><path d="M30,300 C80,312 120,350 170,348 S240,285 280,288 S350,385 405,382 S505,318 585,302" fill="none" stroke="#44546A" stroke-width="3"/><path d="M172,336 Q282,206 396,370" fill="none" stroke="#c46200" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/><circle cx="170" cy="338" r="9" fill="none" stroke="#c46200" stroke-width="2" opacity=".45"/><circle cx="405" cy="372" r="9" fill="#608B37"/><text x="170" y="372" font-size="13" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">stuck here</text><text x="405" y="398" font-size="13" fill="#608B37" text-anchor="middle" font-weight="bold" font-style="normal">better plan</text><rect x="30" y="404" width="555" height="8" rx="4" fill="url(#temp)"/><text x="30" y="430" font-size="13" fill="#C9191E" text-anchor="start" font-weight="normal" font-style="normal">hot: explore</text><text x="585" y="430" font-size="13" fill="#27348B" text-anchor="end" font-weight="normal" font-style="normal">cold: only improvements</text><text x="307" y="430" font-size="13" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">temperature cools down →</text><circle r="9" fill="#c46200"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" values="170.0,338.0;170.0,338.0;150.0,336.0;190.0,335.0;158.0,337.0;183.0,336.0;170.0,338.0;185.7,320.7;201.3,306.2;217.0,294.6;232.7,285.7;248.3,279.6;264.0,276.2;279.7,275.7;295.3,278.0;311.0,283.0;326.7,290.9;342.3,301.5;358.0,315.0;373.7,331.2;389.3,350.2;405.0,372.0;394.0,370.0;413.0,371.0;401.0,372.0;405.0,372.0;405.0,372.0" keyTimes="0.0000;0.0800;0.1320;0.1840;0.2360;0.2880;0.3400;0.3560;0.3720;0.3880;0.4040;0.4200;0.4360;0.4520;0.4680;0.4840;0.5000;0.5160;0.5320;0.5480;0.5640;0.5800;0.6250;0.6700;0.7150;0.7600;1.0000"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.93;1"/></circle><circle cy="408" r="7" fill="#fff" stroke="#1d1d22" stroke-width="2"><animate attributeName="cx" dur="8s" repeatCount="indefinite" values="40;40;575;575" keyTimes="0;0.08;0.8;1"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.06;0.93;1"/></circle></g><text x="282" y="227" font-size="13" fill="#c46200" text-anchor="middle" font-weight="bold" font-style="normal">a worse plan is sometimes kept</text><text x="282" y="243" font-size="13" fill="#c46200" text-anchor="middle" font-weight="normal" font-style="normal">while the search is hot</text></svg>