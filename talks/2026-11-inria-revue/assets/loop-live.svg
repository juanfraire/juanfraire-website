<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="Inria Sans, Helvetica Neue, Arial, sans-serif">
  <!-- The loop that closes on itself (redrawn from fig3 of the IEEE Computer submission). -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9191E"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1067A3"/>
    </marker>
  </defs>
  <style>
    .node { fill: #fff; stroke: #27348B; stroke-width: 2.4; }
    .hot  { fill: #fdf0f0; stroke: #C9191E; }
    .lab  { font-size: 19px; font-weight: 700; fill: #1d1d22; text-anchor: middle; }
    .edge { fill: none; stroke: #C9191E; stroke-width: 3; marker-end: url(#ar); }
    .verb { font-size: 16px; fill: #5b6270; font-style: italic; }
  </style>

  <!-- arcs -->
  <path id="e0" class="edge" d="M 238 58 C 160 70, 110 95, 100 140"/>
  <path id="e1" class="edge" d="M 92 200 C 80 260, 95 305, 128 334"/>
  <path id="e2" class="edge" d="M 252 372 C 300 392, 350 392, 398 372"/>
  <path id="e3" class="edge" d="M 528 334 C 560 300, 570 255, 560 200"/>
  <path id="e4" class="edge" d="M 548 140 C 535 95, 490 68, 412 58"/>

  <text class="verb" x="128" y="88" text-anchor="end">is bought with</text>
  <text class="verb" x="62" y="276" text-anchor="end">adds</text>
  <text class="verb" x="325" y="414" text-anchor="middle">raises</text>
  <text class="verb" x="586" y="276">inflates</text>
  <text class="verb" x="526" y="88">demands more</text>

  <!-- nodes -->
  <rect class="node hot" x="235" y="22" width="180" height="62" rx="10"/>
  <text class="lab" x="325" y="48">redundancy</text>
  <text class="lab" x="325" y="72" style="font-weight:400;font-size:16px">shielding · spares</text>

  <rect class="node" x="22" y="142" width="150" height="56" rx="10"/>
  <text class="lab" x="97" y="177">launched mass</text>

  <rect class="node" x="62" y="336" width="190" height="62" rx="10"/>
  <text class="lab" x="157" y="362">cross-section</text>
  <text class="lab" x="157" y="386" style="font-weight:400;font-size:16px">&amp; debris</text>

  <rect class="node" x="398" y="336" width="190" height="62" rx="10"/>
  <text class="lab" x="493" y="374">collision hazard</text>

  <rect class="node hot" x="488" y="142" width="150" height="56" rx="10"/>
  <text class="lab" x="563" y="177">failure rate</text>

  <!-- the one arc that pushes the other way -->
  <rect x="262" y="262" width="150" height="40" rx="8" fill="#eef5fb" stroke="#1067A3" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="337" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#1067A3">reliable disposal</text>
  <path d="M 285 302 C 270 318, 252 328, 240 336" fill="none" stroke="#1067A3" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="300" y="327" font-size="15" font-style="italic" fill="#1067A3">starves</text>

  <!-- the message -->
  <text x="330" y="165" text-anchor="middle" font-size="19" font-style="italic" font-weight="700" fill="#A60F79">the armour a system adds</text>
  <text x="330" y="190" text-anchor="middle" font-size="19" font-style="italic" font-weight="700" fill="#A60F79">to survive becomes part of</text>
  <text x="330" y="215" text-anchor="middle" font-size="19" font-style="italic" font-weight="700" fill="#A60F79">the hazard it must survive</text>
<path d="M 238 58 C 160 70, 110 95, 100 140" fill="none" stroke="#ff8a72" stroke-width="7" stroke-linecap="round" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;.5;.5;0;0" keyTimes="0;0.000;0.020;0.140;0.190;1"/></path><g opacity="0"><circle r="13" fill="#C9191E" opacity=".22"/><circle r="6.5" fill="#C9191E"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.000;0.140;1"><mpath href="#e0"/></animateMotion><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.000;0.010;0.130;0.140;1"/></g><rect x="22" y="142" width="150" height="56" rx="10" fill="none" stroke="#C9191E" stroke-width="5" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;0;0" keyTimes="0;0.140;0.170;0.240;1"/></rect><path d="M 92 200 C 80 260, 95 305, 128 334" fill="none" stroke="#ff8a72" stroke-width="7" stroke-linecap="round" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;.5;.5;0;0" keyTimes="0;0.200;0.220;0.340;0.390;1"/></path><g opacity="0"><circle r="13" fill="#C9191E" opacity=".22"/><circle r="6.5" fill="#C9191E"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.200;0.340;1"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.200;0.210;0.330;0.340;1"/></g><rect x="62" y="336" width="190" height="62" rx="10" fill="none" stroke="#C9191E" stroke-width="5" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;0;0" keyTimes="0;0.340;0.370;0.440;1"/></rect><path d="M 252 372 C 300 392, 350 392, 398 372" fill="none" stroke="#ff8a72" stroke-width="7" stroke-linecap="round" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;.5;.5;0;0" keyTimes="0;0.400;0.420;0.540;0.590;1"/></path><g opacity="0"><circle r="13" fill="#C9191E" opacity=".22"/><circle r="6.5" fill="#C9191E"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.400;0.540;1"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.400;0.410;0.530;0.540;1"/></g><rect x="398" y="336" width="190" height="62" rx="10" fill="none" stroke="#C9191E" stroke-width="5" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;0;0" keyTimes="0;0.540;0.570;0.640;1"/></rect><path d="M 528 334 C 560 300, 570 255, 560 200" fill="none" stroke="#ff8a72" stroke-width="7" stroke-linecap="round" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;.5;.5;0;0" keyTimes="0;0.600;0.620;0.740;0.790;1"/></path><g opacity="0"><circle r="13" fill="#C9191E" opacity=".22"/><circle r="6.5" fill="#C9191E"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.600;0.740;1"><mpath href="#e3"/></animateMotion><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.600;0.610;0.730;0.740;1"/></g><rect x="488" y="142" width="150" height="56" rx="10" fill="none" stroke="#C9191E" stroke-width="5" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;0;0" keyTimes="0;0.740;0.770;0.840;1"/></rect><path d="M 548 140 C 535 95, 490 68, 412 58" fill="none" stroke="#ff8a72" stroke-width="7" stroke-linecap="round" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;.5;.5;0;0" keyTimes="0;0.800;0.820;0.940;0.990;1"/></path><g opacity="0"><circle r="13" fill="#C9191E" opacity=".22"/><circle r="6.5" fill="#C9191E"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.800;0.940;1"><mpath href="#e4"/></animateMotion><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.800;0.810;0.930;0.940;1"/></g><rect x="235" y="22" width="180" height="62" rx="10" fill="none" stroke="#C9191E" stroke-width="5" opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;0;0" keyTimes="0;0.940;0.970;1.000;1"/></rect></svg>
