<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 424" font-family="Inria Sans, Helvetica Neue, Arial, sans-serif"><defs><marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#27348B"/></marker><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A60F79"/></marker><marker id="o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46200"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker><linearGradient id="temp" x1="0" x2="1"><stop offset="0" stop-color="#C9191E"/><stop offset="1" stop-color="#27348B"/></linearGradient></defs><text x="0" y="24" font-size="20" fill="#A60F79" text-anchor="start" font-weight="bold" font-style="normal">reinforcement learning</text><text x="0" y="48" font-size="17" fill="#1d1d22" text-anchor="start" font-weight="normal" font-style="normal">learns a policy by trial and error</text><text x="0" y="88" font-size="20" fill="#c46200" text-anchor="start" font-weight="bold" font-style="normal">simulated annealing</text><text x="0" y="112" font-size="17" fill="#1d1d22" text-anchor="start" font-weight="normal" font-style="normal">shakes the plan while hot, settles it as it cools</text><g transform="translate(0,-14)"><path d="M30,235.6 C80,256.0 120,320.6 170,317.2 S240,210.1 280,215.2 S350,380.1 405,375.0 S505,266.2 585,239.0 L585,392 L30,392 Z" fill="#fbf3e9"/><path d="M30,235.6 C80,256.0 120,320.6 170,317.2 S240,210.1 280,215.2 S350,380.1 405,375.0 S505,266.2 585,239.0" fill="none" stroke="#44546A" stroke-width="3"/><path d="M172,305.2 Q282,30 396,363.0" fill="none" stroke="#c46200" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/><circle cx="170" cy="307.2" r="9" fill="#c46200"/><circle cx="405" cy="365.0" r="9" fill="#608B37"/><text x="170" y="345.2" font-size="15" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">stuck here</text><text x="405" y="397" font-size="15" fill="#608B37" text-anchor="middle" font-weight="bold" font-style="normal">better plan</text><rect x="30" y="404" width="555" height="8" rx="4" fill="url(#temp)"/><text x="30" y="431" font-size="15" fill="#C9191E" text-anchor="start" font-weight="bold" font-style="normal">hot</text><text x="585" y="431" font-size="15" fill="#27348B" text-anchor="end" font-weight="bold" font-style="normal">cold</text></g></svg>