<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 424" font-family="Inria Sans, Helvetica Neue, Arial, sans-serif"><defs><marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#27348B"/></marker><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A60F79"/></marker><marker id="o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46200"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker><linearGradient id="temp" x1="0" x2="1"><stop offset="0" stop-color="#C9191E"/><stop offset="1" stop-color="#27348B"/></linearGradient></defs><text x="0" y="20" font-size="17" fill="#A60F79" text-anchor="start" font-weight="bold" font-style="normal">reinforcement learning</text><text x="0" y="40" font-size="14" fill="#1d1d22" text-anchor="start" font-weight="normal" font-style="normal">learns what to do in each situation, by trial and error, over many simulated days</text><rect x="4" y="58" width="168" height="62" rx="10" fill="#eef0f8" stroke="#27348B" stroke-width="2"/><text x="88" y="84" font-size="16" fill="#27348B" text-anchor="middle" font-weight="bold" font-style="normal">agent</text><text x="88" y="104" font-size="14" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">the scheduler</text><rect x="402" y="58" width="194" height="62" rx="10" fill="#f5f6f8" stroke="#44546A" stroke-width="2"/><text x="499" y="84" font-size="16" fill="#44546A" text-anchor="middle" font-weight="bold" font-style="normal">environment</text><text x="499" y="104" font-size="14" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">battery · memory · passes</text><path d="M176,72 H398" stroke="#A60F79" stroke-width="2.6" marker-end="url(#m)"/><text x="287" y="64" font-size="14" fill="#A60F79" text-anchor="middle" font-weight="bold" font-style="normal">acquire · downlink · wait</text><path d="M398,106 H176" stroke="#27348B" stroke-width="2.6" marker-end="url(#b)"/><text x="287" y="126" font-size="14" fill="#27348B" text-anchor="middle" font-weight="normal" font-style="normal">new state + reward</text><line x1="0" y1="148" x2="600" y2="148" stroke="#e3e5ea" stroke-width="1.5"/><text x="0" y="174" font-size="17" fill="#c46200" text-anchor="start" font-weight="bold" font-style="normal">simulated annealing</text><text x="0" y="193" font-size="14" fill="#1d1d22" text-anchor="start" font-weight="normal" font-style="normal">search the plan itself: change one decision (shift a downlink,</text><text x="0" y="210" font-size="14" fill="#1d1d22" text-anchor="start" font-weight="normal" font-style="normal">swap an acquisition) and keep the change if the plan improves</text><g transform="translate(0,-14)"><path d="M30,300 C80,312 120,350 170,348 S240,285 280,288 S350,385 405,382 S505,318 585,302 L585,392 L30,392 Z" fill="#fbf3e9"/><path d="M30,300 C80,312 120,350 170,348 S240,285 280,288 S350,385 405,382 S505,318 585,302" fill="none" stroke="#44546A" stroke-width="3"/><path d="M172,336 Q282,206 396,370" fill="none" stroke="#c46200" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/><circle cx="170" cy="338" r="9" fill="#c46200"/><circle cx="405" cy="372" r="9" fill="#608B37"/><text x="170" y="372" font-size="13" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">stuck here</text><text x="405" y="398" font-size="13" fill="#608B37" text-anchor="middle" font-weight="bold" font-style="normal">better plan</text><rect x="30" y="404" width="555" height="8" rx="4" fill="url(#temp)"/><text x="30" y="430" font-size="13" fill="#C9191E" text-anchor="start" font-weight="normal" font-style="normal">hot: explore</text><text x="585" y="430" font-size="13" fill="#27348B" text-anchor="end" font-weight="normal" font-style="normal">cold: only improvements</text><text x="307" y="430" font-size="13" fill="#5b6270" text-anchor="middle" font-weight="normal" font-style="normal">temperature cools down →</text></g><text x="282" y="227" font-size="13" fill="#c46200" text-anchor="middle" font-weight="bold" font-style="normal">a worse plan is sometimes kept</text><text x="282" y="243" font-size="13" fill="#c46200" text-anchor="middle" font-weight="normal" font-style="normal">while the search is hot</text></svg>